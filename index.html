<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday KATHYAYINI M S</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="cursor"></div>
    <div class="container">
        <h1>Happy Birthday <span class="name">KATHYAYINI M S 💗</span></h1>
        <div class="greeting"></div>
        <div class="from">from Harshii 💜</div>
        <div class="cake-wrap">
            <div class="cake" id="cake" role="button" tabindex="0" aria-label="Blow out the candle">
                <div class="candle">
                    <div class="flame" id="flame"></div>
                    <div class="smoke" id="smoke"></div>
                </div>
                <div class="icing"></div>
                <div class="tier top"><span class="sprinkles"></span></div>
                <div class="tier bottom"><span class="sprinkles"></span></div>
                <div class="plate"></div>
            </div>
            <div class="blow-text" id="blowText">Make a wish & blow the candle 🕯️<small>tap the flame (or blow into your mic 🎤)</small></div>
        </div>
        <button class="cta-button">Click to Enter Our World 💕</button>
    </div>

    <script src="script.js">
        
    </script>
    <script src="stars.js"></script>
</body>
</html>
